  name: CI

  on:
    push:
      branches: [main]
    pull_request:

  jobs:
    check:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Install pnpm
          # Version comes from "packageManager" in the root package.json.
          uses: pnpm/action-setup@v4

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: pnpm

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        - name: Typecheck (all packages)
          run: pnpm run typecheck

        - name: Unit tests
          run: pnpm run test

        - name: Build API server
          run: pnpm --filter @workspace/api-server run build

        - name: Expo config check
          working-directory: artifacts/kkamera
          # Patch-version drift is checked locally with `npx expo install --check`;
          # failing CI on every new Expo patch release would just be noise.
          env:
            EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
          run: npx expo-doctor@1.21.8

        - name: Bundle app (iOS + Android)
          working-directory: artifacts/kkamera
          run: npx expo export --platform ios --platform android --output-dir /tmp/expo-export
