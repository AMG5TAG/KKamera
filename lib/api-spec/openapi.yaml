openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: KKamera API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: subscriptions
  - name: affiliates
  - name: cloud-connections
  - name: uploads
  - name: feedback

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset link sent if the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/2fa/setup:
    post:
      operationId: setup2FA
      tags: [auth]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 2FA setup info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFASetup"

  /auth/2fa/verify:
    post:
      operationId: verify2FA
      tags: [auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFAVerifyInput"
      responses:
        "200":
          description: 2FA verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/2fa/disable:
    post:
      operationId: disable2FA
      tags: [auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFAVerifyInput"
      responses:
        "200":
          description: 2FA disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      tags: [users]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/upload-target:
    get:
      operationId: getUploadTarget
      tags: [users]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current upload-target default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTarget"
    put:
      operationId: setUploadTarget
      tags: [users]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadTargetInput"
      responses:
        "200":
          description: Updated upload-target default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTarget"

  /subscriptions/me:
    get:
      operationId: getSubscription
      tags: [subscriptions]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/trial:
    post:
      operationId: startTrial
      tags: [subscriptions]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Trial started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /affiliates/me:
    get:
      operationId: getAffiliateStats
      tags: [affiliates]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Affiliate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateStats"

  /affiliates/referrals:
    get:
      operationId: getReferrals
      tags: [affiliates]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of referrals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Referral"

  /affiliates/invite:
    post:
      operationId: inviteCoworkers
      tags: [affiliates]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCoworkersInput"
      responses:
        "200":
          description: Invites sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /cloud-connections:
    get:
      operationId: listCloudConnections
      tags: [cloud-connections]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Cloud connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CloudConnection"
    post:
      operationId: createCloudConnection
      tags: [cloud-connections]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudConnectionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudConnection"
    delete:
      operationId: deleteAllCloudConnections
      tags: [cloud-connections]
      summary: Delete all of the current user's cloud connections (panic wipe)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: All connections deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /cloud-connections/{id}:
    patch:
      operationId: updateCloudConnection
      tags: [cloud-connections]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudConnectionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudConnection"
    delete:
      operationId: deleteCloudConnection
      tags: [cloud-connections]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /cloud-connections/{id}/test:
    post:
      operationId: testCloudConnection
      tags: [cloud-connections]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResult"

  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Upload queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadItem"
    post:
      operationId: createUpload
      tags: [uploads]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadItem"
    delete:
      operationId: clearUploads
      tags: [uploads]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: All upload history cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /uploads/{id}:
    patch:
      operationId: updateUpload
      tags: [uploads]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadItem"
    delete:
      operationId: deleteUpload
      tags: [uploads]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /oauth/{provider}/initiate:
    post:
      operationId: initiateOAuth
      tags: [oauth]
      summary: Begin an OAuth authorization flow for a cloud provider
      security:
        - BearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [googledrive, onedrive, dropbox]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthInitiateInput"
      responses:
        "200":
          description: Authorization URL to redirect the user to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthInitiateResult"
        "400":
          description: Unknown OAuth provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "503":
          description: Provider OAuth is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthNotConfigured"

  /oauth/{provider}/callback:
    get:
      operationId: oauthCallback
      tags: [oauth]
      summary: OAuth provider redirect target; exchanges the code and stores the connection
      description: >-
        Browser redirect target for the provider (not called programmatically by
        the client). The provider appends `code` + `state` query params on success
        or `error` on failure; the server exchanges the code, stores the
        connection, and 302-redirects to the app.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [googledrive, onedrive, dropbox]
      responses:
        "302":
          description: >-
            Redirect to the app success screen (/oauth-success), the native deep
            link (kkamera://oauth-success), or the error screen (/oauth-error)

  /oauth/status:
    get:
      operationId: getOAuthStatus
      tags: [oauth]
      summary: Report which OAuth providers are configured on the server
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Per-provider configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStatus"

  /oauth/{provider}/refresh/{connectionId}:
    post:
      operationId: refreshOAuthToken
      tags: [oauth]
      summary: Refresh an expired access token for a stored cloud connection
      security:
        - BearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [googledrive, onedrive, dropbox]
        - name: connectionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Unknown provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: No refresh token found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "502":
          description: Token refresh failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/me/export:
    get:
      operationId: exportMyData
      tags: [users]
      summary: Export all personal data for the current user (GDPR)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Personal data export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataExport"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /uploads/witness-notify:
    post:
      operationId: notifyWitness
      tags: [uploads]
      summary: Email a witness that a file was captured and uploaded
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WitnessNotifyInput"
      responses:
        "200":
          description: Witness notified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          description: Too many witness notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    OAuthInitiateInput:
      type: object
      properties:
        name:
          type: string
        platform:
          type: string
          enum: [web, native]
        uploadPath:
          type: string

    OAuthInitiateResult:
      type: object
      required: [authorizeUrl, state]
      properties:
        authorizeUrl:
          type: string
        state:
          type: string

    OAuthNotConfigured:
      type: object
      required: [message, missingEnv]
      properties:
        message:
          type: string
        missingEnv:
          type: array
          items:
            type: string

    OAuthStatus:
      type: object
      description: Map keyed by provider id (googledrive, onedrive, dropbox)
      additionalProperties:
        $ref: "#/components/schemas/OAuthProviderStatus"

    OAuthProviderStatus:
      type: object
      required: [label, configured]
      properties:
        label:
          type: string
        configured:
          type: boolean

    WitnessNotifyInput:
      type: object
      required: [witnessEmail, fileName]
      properties:
        witnessEmail:
          type: string
          format: email
        fileName:
          type: string
          minLength: 1
          maxLength: 500

    UserDataExport:
      type: object
      required: [exportedAt, user, referrals, uploads, feedback]
      properties:
        exportedAt:
          type: string
        user:
          $ref: "#/components/schemas/User"
        subscription:
          oneOf:
            - $ref: "#/components/schemas/Subscription"
            - type: "null"
        referrals:
          type: array
          items:
            $ref: "#/components/schemas/Referral"
        uploads:
          type: array
          items:
            $ref: "#/components/schemas/UploadItem"
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackItem"

    FeedbackItem:
      type: object
      required: [id, type, message, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [bug, feature, other]
        message:
          type: string
        createdAt:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
        referralCode:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        totpCode:
          type: ["string", "null"]

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    InviteCoworkersInput:
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: email

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    UploadTarget:
      type: object
      required: [mode, connectionIds]
      properties:
        mode:
          type: string
          enum: [all, selected, none]
        connectionIds:
          type: array
          items:
            type: integer

    UploadTargetInput:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [all, selected, none]
        connectionIds:
          type: array
          items:
            type: integer

    User:
      type: object
      required: [id, email, name, referralCode, twoFAEnabled, onboardingCompleted, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        referralCode:
          type: string
        twoFAEnabled:
          type: boolean
        onboardingCompleted:
          type: boolean
        createdAt:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: ["string", "null"]
        onboardingCompleted:
          type: boolean

    TwoFASetup:
      type: object
      required: [secret, qrCodeUrl, backupCodes]
      properties:
        secret:
          type: string
        qrCodeUrl:
          type: string
        backupCodes:
          type: array
          items:
            type: string

    TwoFAVerifyInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    Subscription:
      type: object
      required: [id, userId, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        status:
          type: string
          enum: [trial, active, cancelled, expired, past_due, none]
        trialEnd:
          type: ["string", "null"]
        currentPeriodEnd:
          type: ["string", "null"]
        createdAt:
          type: string

    AffiliateStats:
      type: object
      required: [referralCode, totalReferrals, completedReferrals, yearsEarned]
      properties:
        referralCode:
          type: string
        totalReferrals:
          type: integer
        completedReferrals:
          type: integer
        yearsEarned:
          type: integer

    Referral:
      type: object
      required: [id, referredName, status, createdAt]
      properties:
        id:
          type: integer
        referredName:
          type: string
        status:
          type: string
          enum: [pending, completed]
        createdAt:
          type: string

    CloudConnection:
      type: object
      required: [id, userId, type, name, active, hasCredentials, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
          enum: [ftp, webdav, nextcloud, onedrive, googledrive, dropbox]
        provider:
          type: ["string", "null"]
          description: Optional UI sub-flavour hint (e.g. "synology"); upload logic uses `type`.
        name:
          type: string
        active:
          type: boolean
        uploadPath:
          type: ["string", "null"]
        accountLabel:
          type: ["string", "null"]
        hasCredentials:
          type: boolean
        createdAt:
          type: string

    CloudConnectionInput:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [ftp, webdav, nextcloud, onedrive, googledrive, dropbox]
        provider:
          type: ["string", "null"]
          description: Optional UI sub-flavour hint (e.g. "synology"); upload logic uses `type`.
        name:
          type: string
        host:
          type: ["string", "null"]
        port:
          type: ["integer", "null"]
        username:
          type: ["string", "null"]
        password:
          type: ["string", "null"]
        uploadPath:
          type: ["string", "null"]
        oauthCode:
          type: ["string", "null"]

    CloudConnectionUpdate:
      type: object
      properties:
        name:
          type: ["string", "null"]
        active:
          type: ["boolean", "null"]
        uploadPath:
          type: ["string", "null"]
        host:
          type: ["string", "null"]
        port:
          type: ["integer", "null"]
        username:
          type: ["string", "null"]
        password:
          type: ["string", "null"]
        oauthCode:
          type: ["string", "null"]

    TestResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    UploadItem:
      type: object
      required: [id, userId, fileName, fileType, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        fileName:
          type: string
        fileType:
          type: string
        status:
          type: string
          enum: [pending, queued, uploading, done, failed, partial]
        connectionIds:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        createdAt:
          type: string

    UploadInput:
      type: object
      required: [fileName, fileType]
      properties:
        fileName:
          type: string
        fileType:
          type: string
        connectionIds:
          type: ["string", "null"]

    UploadUpdate:
      type: object
      properties:
        status:
          type: ["string", "null"]
        error:
          type: ["string", "null"]

    FeedbackInput:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          enum: [bug, feature, other]
        message:
          type: string
