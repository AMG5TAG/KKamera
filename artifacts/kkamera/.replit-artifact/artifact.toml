kind = "mobile"
previewPath = "/kkamera/"
title = "KKamera"
version = "1.0.0"
id = "artifacts/kkamera"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/kkamera/" ]
localPort = 24623

[services.development]
run = "pnpm --filter @workspace/kkamera run dev"

# No production service: the iOS/Android apps ship via EAS. The route stays off
# "/" (dev runs on the Expo domain anyway) so the website artifact alone owns "/"
# in production; a "/" claim with no production service made the router 500.

[services.env]
PORT = "24623"
BASE_PATH = "/kkamera/"
