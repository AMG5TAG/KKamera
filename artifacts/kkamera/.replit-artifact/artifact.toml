kind = "mobile"
previewPath = "/"
title = "KKamera"
version = "1.0.0"
id = "artifacts/kkamera"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24623

[services.development]
run = "pnpm --filter @workspace/kkamera run dev"

# No production service: the iOS/Android apps ship via EAS. Deploying the Expo
# web export here claimed "/" and shadowed the website on kkamera.app.

[services.env]
PORT = "24623"
BASE_PATH = "/"
